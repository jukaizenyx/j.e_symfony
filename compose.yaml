services:
  je_essentials_mysql:
    image: mysql:latest
    container_name: je_essentials_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - je-essentials-db-data:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      - je-network

  je_essentials_phpmyadmin:
    image: phpmyadmin:latest
    container_name: je_essentials_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: je_essentials_mysql
    ports:
      - "8080:80"
    networks:
      - je-network

  je_essentials_php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: je_essentials_php
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "8000:8000"
    command: php -S 0.0.0.0:8000 -t public public/index.php
    depends_on:
      - je_essentials_mysql
    networks:
      - je-network

volumes:
  je-essentials-db-data:

networks:
  je-network:
